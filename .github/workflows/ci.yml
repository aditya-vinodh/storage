name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # The end-to-end suite again, on Postgres and an S3-compatible store.
  backends:
    runs-on: ubuntu-latest
    services:
      rustfs:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: storage
          RUSTFS_SECRET_KEY: storage-secret
        ports:
          - 9000:9000
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: storage
          POSTGRES_PASSWORD: storage
          POSTGRES_DB: storage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STORAGE_TEST_DATABASE_URL: postgres://storage:storage@localhost:5432/storage_test
      STORAGE_TEST_S3_ENDPOINT: http://localhost:9000
      STORAGE_TEST_S3_ACCESS_KEY_ID: storage
      STORAGE_TEST_S3_SECRET_ACCESS_KEY: storage-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for RustFS
        run: timeout 60 bash -c 'until curl -fs http://localhost:9000/health; do sleep 2; done'
      - run: pnpm test
